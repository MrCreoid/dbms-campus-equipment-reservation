<text x="34" y="350" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">Defining attribute: role. Subclasses have no extra attributes, so the relational schema</text>
