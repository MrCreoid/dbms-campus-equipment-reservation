<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250">
<rect width="100%" height="100%" fill="#fff"/>
<rect x="10" y="20" width="190" height="95" rx="8" fill="#eef0f3" stroke="#4a5561" stroke-width="1.4"/>
<text x="105.0" y="47.375" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#4a5561" text-anchor="middle" xml:space="preserve">GET /equipment</text>
<text x="105.0" y="62.9" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">?q=osc</text>
<text x="105.0" y="78.425" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">&amp;lab=1</text>
<text x="105.0" y="93.95" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">&amp;category=1</text>
<rect x="240" y="20" width="200" height="95" rx="8" fill="#e6eef4" stroke="#2f5d7c" stroke-width="1.4"/>
<text x="340.0" y="47.375" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2f5d7c" text-anchor="middle" xml:space="preserve">equipment_list()</text>
<text x="340.0" y="62.9" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">builds conditions[]</text>
<text x="340.0" y="78.425" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">and params[] lists</text>
<text x="340.0" y="93.95" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">only for filters given</text>
<rect x="480" y="20" width="190" height="95" rx="8" fill="#f8eee2" stroke="#a8641f" stroke-width="1.4"/>
<text x="575.0" y="47.375" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#a8641f" text-anchor="middle" xml:space="preserve">MySQL</text>
<text x="575.0" y="62.9" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">equipment JOIN</text>
<text x="575.0" y="78.425" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">categories JOIN labs</text>
<text x="575.0" y="93.95" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle" xml:space="preserve">+ 2 EXISTS subqueries</text>
<polyline points="200,67 238,67" fill="none" stroke="#1f3a4d" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="238,67 230.7,70.3 230.7,63.7" fill="#1f3a4d"/>
<polyline points="440,67 478,67" fill="none" stroke="#1f3a4d" stroke-width="1.4" stroke-linejoin="round"/>
<polygon points="478,67 470.7,70.3 470.7,63.7" fill="#1f3a4d"/>
<rect x="10" y="135" width="660" height="105" rx="8" fill="#f6f7f9" stroke="#c9d0d8" stroke-width="1.2"/>
<text x="24" y="158" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">conditions = ['(e.equipment_name LIKE %s OR e.asset_tag LIKE %s)',</text>
<text x="24" y="175" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">              'e.lab_id = %s', 'e.category_id = %s']</text>
<text x="24" y="192" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">params     = ['%osc%', '%osc%', 1, 1]</text>
<text x="24" y="209" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">where      = 'WHERE ' + ' AND '.join(conditions)   # only fixed text is joined</text>
<text x="24" y="226" font-family="Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">items      = query(sql_with_where, params)          # values bound by the driver</text>
</svg>
