<rect x="20" y="305" width="640" height="105" rx="8" fill="#f6f7f9" stroke="#c9d0d8" stroke-width="1.2"/>
<text x="34" y="328" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2933" text-anchor="start" xml:space="preserve">Rule used in booking_problem():</text>
<text x="34" y="352" font-family="Menlo, Consolas, monospace" font-size="11.2" font-weight="600" fill="#1f3a4d" text-anchor="start" xml:space="preserve">existing.start_time &lt; requested.end_time AND existing.end_time &gt; requested.start_time</text>
<text x="34" y="376" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">Strict &lt; and &gt; mean intervals are half-open [start, end): a slot may start exactly when</text>
<text x="34" y="392" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2933" text-anchor="start" xml:space="preserve">another ends. Only rows with status = 'approved' are compared — pending requests never block.</text>
